aid: prosper
name: Prosper
description: >-
  Prosper Marketplace operates one of the largest peer-to-peer (marketplace)
  lending platforms in the United States, matching individual and institutional
  investors with consumers seeking personal loans, and also offering a HELOC
  and a credit-card product. For investors, Prosper publishes a RESTful Investor
  API that lets individual, institutional, and third-party agents connect
  directly to the platform to view account balances, search active loan
  listings, place orders (bids) to purchase Notes, and track owned Notes, loans,
  and payments. The API uses OAuth 2.0 over SSL with comprehensive filtering and
  sorting, and offers a sandbox environment for integration testing. This
  profile was surfaced as a portfolio company of Emergence Capital, IVP, and QED
  Investors and enriched from Prosper's public developer documentation.
